
<!DOCTYPE html>
<html>
<head>
    <title>Google Pay Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f3f4;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            background: white;
            width: 320px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px #ccc;
        }
        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        button {
            background: #4285f4;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="box">
    <h1><span style="color:#4285f4">G</span> Pay</h1>
    <h3>Welcome to Google Pay</h3>

    <form action="/login" method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password"
               placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}

    <p>Demo: admin / 1234</p>
</div>
</body>
</html>
