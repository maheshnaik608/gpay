
<!DOCTYPE html>
<html>
<head>
    <title>GPay Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f3f4;
            margin: 0;
        }
        header {
            background: white;
            padding: 20px;
            color: #4285f4;
            font-size: 25px;
        }
        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 25px;
            margin: 15px 0;
            border-radius: 15px;
        }
        input, button {
            padding: 12px;
            margin: 8px 0;
            width: 95%;
            box-sizing: border-box;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        a { color: #4285f4; margin-right: 15px; }
    </style>
</head>
<body>

<header>G Pay</header>

<div class="container">
    <h2>Welcome, {{ username }}</h2>

    <div class="card">
        <h3>Account Balance</h3>
        <h1>₹ {{ "%.2f"|format(balance) }}</h1>
    </div>

    <div class="card">
        <h3>Send Money</h3>
        <form action="/send" method="POST">
            <input name="receiver"
                   placeholder="Receiver UPI ID or name" required>
            <input name="amount" type="number"
                   placeholder="Amount" min="0.01"
                   step="0.01" required>
            <button type="submit">Send Money</button>
        </form>
    </div>

    <div class="card">
        <h3>Mobile Recharge</h3>
        <form action="/recharge" method="POST">
            <input name="mobile" placeholder="Mobile Number"
                   pattern="[0-9]{10}" required>
            <input name="amount" type="number"
                   placeholder="Recharge Amount"
                   min="0.01" step="0.01" required>
            <button type="submit">Recharge</button>
        </form>
    </div>

    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}

    <div class="card">
        <a href="/history">Transaction History</a>
        <a href="/logout">Logout</a>
    </div>
</div>

</body>
</html>
